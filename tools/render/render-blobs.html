<!doctype html><html><head><meta charset="utf-8"><title>Blob Frames</title>
<link rel="stylesheet" href="blob-anim.css">
<style>html,body{margin:0;padding:0;background:transparent}
.grid{display:grid;grid-template-columns:repeat(12,256px);grid-auto-rows:272px}
.grid>div{width:256px;height:272px;display:flex;align-items:center;justify-content:center}</style></head>
<body><div class="grid" id="g"></div>
<script src="blob-defs.js"></script>
<script>
// Rows: costumes; columns: palettes 0..11. Each cell is one 16×8-cell terminal box at 16×34 px per cell.
const COSTUMES=['fable','heavy','careful','medium','light','explore','other'];
const scale=256/30;
document.getElementById('g').innerHTML=COSTUMES.map(k=>Array.from({length:12},(_,p)=>`<div>${svg(k,scale,p+12)}</div>`).join('')).join('');
const t=Number(new URLSearchParams(location.search).get('t')||0);
for(const a of document.getAnimations()){a.pause();a.currentTime=t}
</script></body></html>
