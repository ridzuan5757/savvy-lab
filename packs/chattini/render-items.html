<!doctype html><html><head><meta charset="utf-8"><title>Chattini Items</title>
<style>html,body{margin:0;padding:0;background:transparent}.row{display:flex}.row>div{width:128px;height:112px}.ov>div{width:48px;height:48px}.bench>div{height:34px}svg{display:block}</style></head>
<body><div class="row" id="items"></div><div class="row ov" id="over"></div><div class="row bench" id="bench"></div>
<script>
// Chattini's bench items, drawn for this pack in the emote style: thick dark
// outlines, flat pastel colours and a soft shine. Half emote props, half
// Italian café. Each item sits inside x 26..102 and stands on y 108.
const O='#1B2B3A',S='stroke="#1B2B3A" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"',HI='rgba(255,255,255,.7)';
const ITEMS=[
 // pickle
 `<g transform="rotate(-24 64 72)"><rect x="50" y="34" width="28" height="74" rx="14" fill="#7BC24A" ${S}/><path d="M57 46V96" stroke="${HI}" stroke-width="4" stroke-linecap="round"/>${[[66,48],[70,62],[63,74],[70,86],[64,98]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.6" fill="#4E8F2A"/>`).join('')}</g>`,
 // gift box
 `<rect x="36" y="62" width="56" height="46" rx="4" fill="#F78FB3" ${S}/><rect x="32" y="52" width="64" height="14" rx="3" fill="#FBB4CC" ${S}/><path d="M64 52V108" stroke="#FFD34E" stroke-width="9"/><path d="M64 52V108" fill="none" ${S} stroke-width="0"/><path d="M64 52C52 34 38 42 48 50C52 53 60 53 64 52C68 53 76 53 80 50C90 42 76 34 64 52Z" fill="#FFD34E" ${S}/><path d="M40 70V100" stroke="${HI}" stroke-width="4" stroke-linecap="round"/>`,
 // flower in a pot
 `<path d="M64 74C64 60 64 52 64 46" stroke="#4E8F2A" stroke-width="4"/><path d="M64 66C56 58 48 60 46 64C52 68 58 68 64 66Z" fill="#7BC24A" ${S} stroke-width="2.4"/>${[0,72,144,216,288].map(a=>`<ellipse cx="64" cy="28" rx="8" ry="11" fill="#F98CB0" ${S} stroke-width="2.6" transform="rotate(${a} 64 40)"/>`).join('')}<circle cx="64" cy="40" r="7" fill="#FFD34E" ${S} stroke-width="2.6"/><path d="M46 76H82L78 106Q77 108 74 108H54Q51 108 50 106Z" fill="#8FD3F4" ${S}/><path d="M44 76H84" ${S} stroke-width="4"/>`,
 // glow sticks
 `<g transform="rotate(-18 64 74)"><rect x="46" y="30" width="12" height="74" rx="6" fill="#FF7BC8" ${S}/><rect x="48" y="30" width="8" height="74" rx="4" fill="rgba(255,255,255,.35)"/></g><g transform="rotate(16 64 74)"><rect x="70" y="30" width="12" height="74" rx="6" fill="#FFE45C" ${S}/><rect x="72" y="30" width="8" height="74" rx="4" fill="rgba(255,255,255,.4)"/></g><ellipse cx="64" cy="106" rx="24" ry="3" fill="rgba(255,123,200,.35)"/>`,
 // espresso cup
 `<ellipse cx="64" cy="104" rx="30" ry="5" fill="#F4F2EC" ${S}/><path d="M42 74H86V90Q86 102 64 102Q42 102 42 90Z" fill="#FFFFFF" ${S}/><ellipse cx="64" cy="74" rx="22" ry="5" fill="#6B3E26" ${S}/><path d="M86 80Q98 80 96 90Q94 96 85 94" fill="none" ${S}/><path d="M56 62Q52 56 56 50T56 38M70 62Q66 56 70 50T70 38" fill="none" stroke="#B9B6C4" stroke-width="3" stroke-linecap="round"/><path d="M47 80V92" stroke="${HI}" stroke-width="3.5" stroke-linecap="round"/>`,
 // pizza slice on a plate
 `<ellipse cx="64" cy="102" rx="36" ry="6" fill="#FFFFFF" ${S}/><path d="M34 96L64 38L94 96Q64 104 34 96Z" fill="#FFD36B" ${S}/><path d="M34 96Q64 104 94 96" fill="none" stroke="#E0A040" stroke-width="7" stroke-linecap="round"/><path d="M34 96Q64 104 94 96" fill="none" ${S}/>${[[58,64],[72,80],[52,84],[66,52]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="#E94F4F" ${S} stroke-width="2"/>`).join('')}<path d="M60 76l4 4" stroke="#4E8F2A" stroke-width="3" stroke-linecap="round"/>`,
 // gelato cone
 `<path d="M48 64L64 108L80 64Z" fill="#E8B26A" ${S}/><path d="M54 70L70 92M60 66L74 82M66 66L58 88" stroke="#C98A4B" stroke-width="2"/><circle cx="56" cy="56" r="13" fill="#F98CB0" ${S}/><circle cx="72" cy="56" r="13" fill="#9BE8C8" ${S}/><circle cx="64" cy="40" r="12" fill="#FFF3D6" ${S}/><circle cx="64" cy="27" r="4" fill="#E94F4F" ${S} stroke-width="2"/><path d="M58 36Q60 32 64 32" stroke="${HI}" stroke-width="3" fill="none" stroke-linecap="round"/>`,
 // pasta bowl
 `<path d="M30 76H98Q96 104 64 106Q32 104 30 76Z" fill="#8FD3F4" ${S}/><path d="M36 76Q40 58 64 58Q88 58 92 76Z" fill="#FFD98A" ${S}/><path d="M42 72Q50 62 58 70T74 70T88 72M46 66Q56 60 64 66T82 66" stroke="#E8B04A" stroke-width="2.4" fill="none"/><ellipse cx="66" cy="62" rx="12" ry="6" fill="#E94F4F" ${S} stroke-width="2.4"/><path d="M68 54Q74 48 78 54Q72 58 68 54Z" fill="#4E8F2A"/><path d="M36 84Q40 96 50 100" stroke="${HI}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
];
const svg=(w,h,body)=>`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
document.getElementById('items').innerHTML=ITEMS.map(s=>`<div>${svg(128,112,s)}</div>`).join('');
// New, edit and delete marks: a heart pop, a sparkle, a puff; two frames each.
const star=(cx,cy,r,f)=>`<path d="M${cx} ${cy-r}Q${cx+r*.18} ${cy-r*.18} ${cx+r} ${cy}Q${cx+r*.18} ${cy+r*.18} ${cx} ${cy+r}Q${cx-r*.18} ${cy+r*.18} ${cx-r} ${cy}Q${cx-r*.18} ${cy-r*.18} ${cx} ${cy-r}Z" fill="${f}"/>`;
const heart=(s)=>`<path d="M24 ${36*s+0}C${24-14*s} ${36-12*s} ${24-12*s} ${14} 24 ${20}C${24+12*s} ${14} ${24+14*s} ${36-12*s} 24 ${36*s}Z" fill="#F98CB0" stroke="${O}" stroke-width="2.2" stroke-linejoin="round"/>`;
const OVER=[
 `<path d="M24 37C10 27 10 13 24 19C38 13 38 27 24 37Z" fill="#F98CB0" stroke="${O}" stroke-width="2.4" stroke-linejoin="round"/><path d="M18 20Q20 17 23 18" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>`,
 `<path d="M24 40C7 28 7 10 24 17C41 10 41 28 24 40Z" fill="#FF7BAA" stroke="${O}" stroke-width="2.4" stroke-linejoin="round"/><path d="M17 18Q20 15 23 16" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>`,
 star(22,24,16,'#FFE27A')+star(37,11,6,'#F5C542'),
 star(24,24,11,'#F5C542')+star(10,10,7,'#FFE27A')+star(38,36,5,'#FFE27A'),
 `<g fill="#B9BCC8" opacity=".9"><circle cx="17" cy="28" r="9"/><circle cx="29" cy="25" r="11"/><circle cx="23" cy="34" r="8"/><circle cx="34" cy="33" r="7"/></g>`,
 `<g fill="#9EA3B0" opacity=".55"><circle cx="12" cy="24" r="7"/><circle cx="36" cy="20" r="8"/><circle cx="24" cy="12" r="6"/><circle cx="26" cy="34" r="7"/><circle cx="40" cy="36" r="4"/><circle cx="8" cy="38" r="4"/></g>`,
];
document.getElementById('over').innerHTML=OVER.map(s=>`<div>${svg(48,48,s)}</div>`).join('');
// The café counter: 16×34 px per cell; a pink top, a sky-blue trim, white legs.
const bench=(cols,leg)=>{const w=cols*16;return svg(w,34,`<rect x="0" y="0" width="${w}" height="2" fill="#FFE3EC"/><rect x="0" y="2" width="${w}" height="8" fill="#F8C6D6"/><rect x="0" y="10" width="${w}" height="3" fill="#8FD3F4"/><rect x="0" y="13" width="${w}" height="5" fill="#E7A9BE"/>${leg==='l'?`<rect x="5" y="18" width="12" height="16" rx="2" fill="#F4F2EC"/>`:leg==='r'?`<rect x="${w-17}" y="18" width="12" height="16" rx="2" fill="#F4F2EC"/>`:''}`)};
document.getElementById('bench').innerHTML=[bench(5,'l'),bench(5),bench(1),bench(5,'r')].map(s=>`<div>${s}</div>`).join('');
</script></body></html>
